[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a2rl-drone-training"
version = "0.1.0"
description = "JAX/Crazyflow PPO training stack for autonomous FPV racing drones."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "crazyflow==0.1.0",
    "jax>=0.4.30",
    "numpy>=1.26",
]

[project.scripts]
a2rl-drone-train = "a2rl_drone_training.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
